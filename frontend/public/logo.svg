<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Progress ring (270 degrees = 75% progress) -->
  <circle 
    cx="256" 
    cy="256" 
    r="200" 
    stroke="#10b981" 
    stroke-width="16" 
    fill="none"
    stroke-linecap="round"
    stroke-dasharray="1256.6 419"
    transform="rotate(-135 256 256)"
    opacity="0.9"
  />
  
  <!-- Background ring (subtle) -->
  <circle 
    cx="256" 
    cy="256" 
    r="200" 
    stroke="#374151" 
    stroke-width="16" 
    fill="none"
    opacity="0.2"
  />
  
  <!-- Open book - left page -->
  <path 
    d="M 256 200 L 200 320 L 220 325 L 256 220 Z" 
    fill="#f3f4f6" 
    stroke="#f3f4f6" 
    stroke-width="2"
    stroke-linejoin="round"
  />
  
  <!-- Open book - right page -->
  <path 
    d="M 256 200 L 312 320 L 292 325 L 256 220 Z" 
    fill="#e5e7eb" 
    stroke="#e5e7eb" 
    stroke-width="2"
    stroke-linejoin="round"
  />
  
  <!-- Book spine/center line -->
  <line 
    x1="256" 
    y1="200" 
    x2="256" 
    y2="220" 
    stroke="#d1d5db" 
    stroke-width="3"
    stroke-linecap="round"
  />
  
  <!-- Bookmark accent -->
  <path 
    d="M 256 180 L 248 200 L 256 196 L 264 200 Z" 
    fill="#10b981"
    opacity="0.8"
  />
</svg>
